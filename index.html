<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marksheet Scanner → Google Sheets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 28px; }
    label { font-size: 13px; font-weight: 500; color: #444; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 14px; color: #1a1a1a;
      outline: none; transition: border 0.2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #4a86e8; }
    .drop-zone {
      border: 2px dashed #c5d4f0;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8faff;
      margin-bottom: 20px;
    }
    .drop-zone.dragover { border-color: #4a86e8; background: #eef2ff; }
    .drop-zone .icon { font-size: 36px; margin-bottom: 10px; }
    .drop-zone p { font-size: 15px; color: #555; }
    .drop-zone span { font-size: 13px; color: #999; display: block; margin-top: 4px; }
    #file-input { display: none; }
    .file-name {
      font-size: 13px; color: #4a86e8; font-weight: 500;
      text-align: center; margin-bottom: 16px; min-height: 20px;
    }
    button {
      width: 100%; padding: 13px;
      background: #4a86e8; color: white;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #3a76d8; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .status {
      margin-top: 20px; padding: 14px 18px;
      border-radius: 10px; font-size: 14px;
      display: none;
    }
    .status.loading { background: #eef2ff; color: #3a76d8; display: block; }
    .status.success { background: #eafaf1; color: #1a7a4a; display: block; }
    .status.error   { background: #fef0f0; color: #c0392b; display: block; }
    .preview {
      margin-top: 20px; background: #f8f9fa;
      border-radius: 10px; padding: 16px;
      display: none; max-height: 240px; overflow-y: auto;
    }
    .preview h3 { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; }
    .field-row {
      display: flex; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .field-row:last-child { border-bottom: none; }
    .field-key { color: #666; }
    .field-val { color: #1a1a1a; font-weight: 500; text-align: right; max-width: 60%; }
    .tip { font-size: 12px; color: #999; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <h1>📋 Marksheet Scanner</h1>
  <p class="subtitle">Upload a marksheet PDF or image — scores auto-fill into Google Sheets</p>

  <label>Gemini API Key
    <a href="https://aistudio.google.com/app/apikey" target="_blank"
       style="font-size:11px;color:#4a86e8;margin-left:6px;">Get free key ↗</a>
  </label>
  <input type="password" id="gemini-key" placeholder="AIza..." autocomplete="off" />

  <label>Exam / Sheet Label <span style="font-weight:400;color:#999">(optional — added as a column)</span></label>
  <input type="text" id="exam-label" placeholder="e.g. GPSC Mains 2024" />

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="icon">📄</div>
    <p>Drop PDF or image here</p>
    <span>or click to browse · PDF, JPG, PNG, JPEG</span>
  </div>
  <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png" />
  <div class="file-name" id="file-name"></div>

  <button id="upload-btn" onclick="processFile()" disabled>Scan &amp; Send to Sheets</button>

  <div class="status" id="status"></div>
  <div class="preview" id="preview">
    <h3>Extracted fields (preview before sending)</h3>
    <div id="preview-fields"></div>
  </div>
  <p class="tip">Your API key is never stored — it stays in your browser only.</p>
</div>

<script src="/app.js"></script>
</body>
</html>
